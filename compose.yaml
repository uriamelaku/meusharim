services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meusharim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meusharim}
      POSTGRES_DB: ${POSTGRES_DB:-meusharim}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meusharim}:${POSTGRES_PASSWORD:-meusharim}@db:5432/${POSTGRES_DB:-meusharim}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env (see .env.example)}
      # Docker on Windows/macOS does not forward file-change events; poll for --reload.
      WATCHFILES_FORCE_POLLING: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      WATCH_POLLING: "true"
      VITE_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env (see .env.example)}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env (see .env.example)}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
